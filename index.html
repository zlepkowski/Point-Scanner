<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pointscanner · Free award flight search</title>
    <meta
      name="description"
      content="Free, open-source award flight search. Compare award space across 20 loyalty programs and find the sweet spots. No account, no tracking."
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M17 25a8 8 0 0 1 8-8M12 25a13 13 0 0 1 13-13' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='24.5' cy='24.5' r='2.6' fill='%23fbbf24'/%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint so dark-mode users never see a white flash.
      (function () {
        var t = 'system';
        try {
          t = JSON.parse(localStorage.getItem('pointscanner:theme')) || 'system';
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="dist/pointscanner.css" />
  </head>
  <body class="min-h-screen bg-ink-50 font-sans text-ink-900 antialiased">
    <div id="app-header"></div>
    <main id="main" tabindex="-1" class="mx-auto max-w-7xl px-4 py-6 sm:py-10">
      <div class="space-y-4" aria-busy="true" aria-label="Loading award data">
        <div class="shimmer h-10 w-2/3"></div>
        <div class="shimmer h-5 w-1/2"></div>
        <div class="grid gap-4 sm:grid-cols-3">
          <div class="shimmer h-48"></div>
          <div class="shimmer h-48"></div>
          <div class="shimmer h-48"></div>
        </div>
      </div>
    </main>
    <div id="app-footer"></div>
    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <noscript>
      <p style="max-width: 40rem; margin: 2rem auto; padding: 0 16px">
        Pointscanner runs entirely in your browser and needs JavaScript to search award space.
      </p>
    </noscript>
    <!--
      Real data: set data-awards-url="awards.json" below when the site is served over http(s),
      or, when opening this file from disk, add a script before this one that defines
      window.POINTSCANNER_AWARDS = [...]. Format: see the About page.
    -->
    <script src="dist/pointscanner.js" data-awards-url=""></script>
  </body>
</html>
